name: Publish to PyPI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.version.outputs.should_publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.10

      - name: Sync locked environment
        run: uv sync --locked

      - name: Check formatting and lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Check types and dead code
        run: |
          uv run ty check
          uv run vulture

      - name: Run tests
        run: uv run pytest -q

      - name: Build distributions
        run: uv build --no-sources

      - name: Verify isolated built wheel
        run: uv run python .github/ci/verify_built_wheel.py

      - name: Check whether this version is new
        id: version
        shell: pwsh
        env:
          IS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:IS_RELEASE_TAG -ne "true") {
            "should_publish=false" >> $env:GITHUB_OUTPUT
            Write-Output "Verification-only run; PyPI publication requires a v* tag."
            exit 0
          }
          $version = uv version --short
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag $env:RELEASE_TAG must match package version v$version"
          }
          $response = Invoke-WebRequest `
            -Uri "https://pypi.org/pypi/word-mcp-codemode-live/$version/json" `
            -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) {
            "should_publish=false" >> $env:GITHUB_OUTPUT
            Write-Output "PyPI already has $version; build verified, publish skipped."
          } else {
            "should_publish=true" >> $env:GITHUB_OUTPUT
            Write-Output "PyPI does not have $version; release will be published."
          }

      - name: Upload distributions
        if: steps.version.outputs.should_publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/word-mcp-codemode-live/
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
