[build-system]
requires = ["uv_build>=0.12.7"]
build-backend = "uv_build"

[project]
name = "word-mcp-codemode-live"
version = "0.1.2"
description = "Code Mode MCP server for fast, verified Microsoft Word editing on Windows"
readme = "README.md"
maintainers = [{ name = "chikingsley" }]
license = "MIT"
license-files = ["LICENSE"]
# Python 3.10 is the minimum runtime; pywin32's 312 below is its package
# release number, not a Python-version requirement.
requires-python = ">=3.10"
keywords = ["mcp", "word", "docx", "microsoft-word", "code-mode", "fastmcp", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # MCP server, Code Mode discovery, and sandboxed execute tool.
    "fastmcp[code-mode]==4.0.0",
    # Imported directly by the package-wide DOCX save-preservation hook.
    "lxml>=6.1.2",
    # Imported directly for MCP content and annotation types.
    "mcp>=2.0.0,<3.0.0",
    # Rasterizes Microsoft Word's PDF export for page-image verification.
    "pymupdf>=1.26.4",
    # File-based DOCX/OOXML editing.
    "python-docx>=1.2.0",
    # Used directly to validate nested batch calls before invoking tool functions.
    "pydantic>=2.12.5",
    # Microsoft Word COM automation and Running Object Table access.
    "pywin32>=312",
]

[project.urls]
Homepage = "https://github.com/chikingsley/word-mcp-codemode-live"
Repository = "https://github.com/chikingsley/word-mcp-codemode-live"
Issues = "https://github.com/chikingsley/word-mcp-codemode-live/issues"
Changelog = "https://github.com/chikingsley/word-mcp-codemode-live/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "import-linter>=2.7",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0",
    "ruff>=0.16.5",
    "ty>=0.0.75",
    "vulture>=2.14",
]

[project.scripts]
word-mcp-codemode-live = "word_mcp_codemode_live.main:main"

[tool.uv.build-backend]
module-name = "word_mcp_codemode_live"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "C90",
    "PLC0415",
    "S110",
    "S112",
    "RUF013",
]

[tool.ruff.lint.per-file-ignores]
# These imports intentionally delay Windows-only or monkey-patched dependencies
# until the owning integration boundary is activated.
".github/ci/verify_built_wheel.py" = ["PLC0415"]
"src/word_mcp_codemode_live/ooxml/package_access.py" = ["PLC0415"]
"src/word_mcp_codemode_live/ooxml/preservation.py" = ["PLC0415"]
"src/word_mcp_codemode_live/tools/export.py" = ["PLC0415"]
"src/word_mcp_codemode_live/tools/lifecycle.py" = ["PLC0415"]
"src/word_mcp_codemode_live/word/session.py" = ["PLC0415"]
"tests/test_live_batch.py" = ["PLC0415"]
"tests/test_live_merge.py" = ["PLC0415"]
"tests/test_live_navigation.py" = ["PLC0415"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.10"

[tool.ty.analysis]
allowed-unresolved-imports = ["pythoncom", "win32com.**"]

[tool.vulture]
min_confidence = 80
paths = ["src", "tests"]
sort_by_size = true

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]

[tool.coverage.run]
branch = true
source = ["word_mcp_codemode_live"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.importlinter]
root_package = "word_mcp_codemode_live"

[[tool.importlinter.contracts]]
name = "Infrastructure does not depend on MCP tools"
type = "forbidden"
source_modules = [
    "word_mcp_codemode_live.word",
    "word_mcp_codemode_live.ooxml",
    "word_mcp_codemode_live.filesystem",
    "word_mcp_codemode_live.validation",
]
forbidden_modules = ["word_mcp_codemode_live.tools"]

[[tool.importlinter.contracts]]
name = "Live Word and closed OOXML implementations stay independent"
type = "independence"
modules = [
    "word_mcp_codemode_live.word",
    "word_mcp_codemode_live.ooxml",
]

[[tool.importlinter.contracts]]
name = "Tools do not depend on server assembly"
type = "forbidden"
source_modules = ["word_mcp_codemode_live.tools"]
forbidden_modules = ["word_mcp_codemode_live.main"]
