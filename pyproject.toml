[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "word-mcp-codemode-live"
version = "0.1.0"
description = "Code Mode MCP server for live Microsoft Word editing and cross-platform DOCX tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "word", "docx", "microsoft-word", "code-mode", "fastmcp", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "docx2pdf>=0.1.8",
    "fastmcp[code-mode]>=3.4.7,<4",
    "lxml>=6.1.2",
    "mcp>=1.24.0,<2",
    "pillow>=12.3.0; sys_platform == 'win32'",
    "python-docx>=1.2.0",
    "pywin32>=312; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
    "ty>=0.0.75",
    "vulture>=2.14",
]

[project.urls]
Homepage = "https://github.com/chikingsley/word-mcp-codemode-live"
Repository = "https://github.com/chikingsley/word-mcp-codemode-live"
Issues = "https://github.com/chikingsley/word-mcp-codemode-live/issues"
Changelog = "https://github.com/chikingsley/word-mcp-codemode-live/blob/main/CHANGELOG.md"

[project.scripts]
word-mcp-codemode-live = "word_mcp_codemode_live.main:main"

[tool.uv.build-backend]
module-name = "word_mcp_codemode_live"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF013"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.10"

[tool.ty.analysis]
allowed-unresolved-imports = ["pythoncom", "win32com.**"]

[tool.vulture]
min_confidence = 80
paths = ["src", "tests"]
sort_by_size = true
