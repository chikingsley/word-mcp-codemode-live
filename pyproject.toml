[build-system]
requires = ["uv_build>=0.12.7"]
build-backend = "uv_build"

[project]
name = "word-mcp-codemode-live"
version = "0.1.1"
description = "Code Mode MCP server for fast, verified Microsoft Word editing on Windows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Python 3.10 is the minimum runtime; pywin32's 312 below is its package
# release number, not a Python-version requirement.
requires-python = ">=3.10"
keywords = ["mcp", "word", "docx", "microsoft-word", "code-mode", "fastmcp", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # MCP server, Code Mode discovery, and sandboxed execute tool.
    "fastmcp[code-mode]>=3.4.7",
    # Direct OOXML work for comments, footnotes, links, and save preservation.
    "lxml>=6.1.2",
    # Imported directly for MCP content and annotation types.
    "mcp>=1.24.0",
    # Rasterizes Microsoft Word's PDF export for page-image verification.
    "pymupdf>=1.26.4",
    # File-based DOCX/OOXML editing.
    "python-docx>=1.2.0",
    # Microsoft Word COM automation and Running Object Table access.
    "pywin32>=312",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
    "ty>=0.0.75",
    "vulture>=2.14",
]

[project.scripts]
word-mcp-codemode-live = "word_mcp_codemode_live.main:main"

[tool.uv.build-backend]
module-name = "word_mcp_codemode_live"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF013"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.10"

[tool.ty.analysis]
allowed-unresolved-imports = ["pythoncom", "win32com.**"]

[tool.vulture]
min_confidence = 80
paths = ["src", "tests"]
sort_by_size = true
